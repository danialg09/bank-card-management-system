version: '3'
services:
      postgres:
            image: postgres:15-alpine
            ports:
                  - "5433:5432"
            environment:
                  - POSTGRES_USER=postgres
                  - POSTGRES_PASSWORD=postgres
                  - POSTGRES_DB=bank_db
      redis:
            image: redis:7.0.12
            ports:
                  - "6379:6379"